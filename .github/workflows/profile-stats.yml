name: Refresh profile statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update public stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_stats.py
      - name: Update engineering activity
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          INCLUDE_PRIVATE: ${{ vars.PROFILE_INCLUDE_PRIVATE || 'true' }}
        run: |
          if [ "$INCLUDE_PRIVATE" = "true" ] && [ -z "$PROFILE_STATS_TOKEN" ]; then
            echo '::notice::Private activity snapshot preserved. Configure PROFILE_STATS_TOKEN to enable private activity refreshes.'
            exit 0
          fi
          python scripts/update_activity.py
      - name: Commit updated stats
        run: |
          if test -n "$(git status --porcelain -- assets/)"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/
            git commit -m 'Refresh profile statistics'
            git push
          fi
